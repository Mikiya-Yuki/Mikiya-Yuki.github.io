# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

appearance:
  mode: light        # 前回設定した箇所
  switcher: false    # 前回設定した箇所
  theme: minimal

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Yuki Mikiya is a Ph.D. Student in Political Science at Keio University and a Visiting Fellow at the Harvard-Yenching Institute, working on propaganda, information control, and quantitative text analysis in contemporary China.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: true
    show_theme_chooser: false  # ここを true から false に変更
    logo:
      text: 'Yuki Mikiya'

# Site footer
footer:
  copyright:
    notice: '© {year} Yuki Mikiya. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
